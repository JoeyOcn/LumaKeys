name: Compilar MidiCat

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    name: Mac (VST3, AU y app)
    runs-on: macos-15-intel   # las Mac arm64 de GitHub están saturadas; Intel compila el binario universal igual
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Configurar
        run: cmake -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Compilar
        run: cmake --build build --config Release --parallel 4

      - name: Firmar (ad-hoc)
        run: |
          ART=build/MidiCat_artefacts/Release
          ls -la "$ART" "$ART/VST3" "$ART/AU" "$ART/Standalone"
          codesign --force --deep --sign - "$ART/VST3/MidiCat.vst3"
          codesign --force --deep --sign - "$ART/AU/MidiCat.component"
          codesign --force --deep --sign - "$ART/Standalone/MidiCat.app"
          lipo -info "$ART/VST3/MidiCat.vst3/Contents/MacOS/MidiCat"

      - name: Probar con pluginval
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --skip-gui-tests --validate-in-process \
            --timeout-ms 300000 --validate "build/MidiCat_artefacts/Release/VST3/MidiCat.vst3"

      - name: Probar Audio Unit (auval)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/MidiCat_artefacts/Release/AU/MidiCat.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          sleep 2
          auval -v aumu Msky Jocn

      - name: Empaquetar
        run: |
          ART=build/MidiCat_artefacts/Release
          mkdir -p dist/MidiCat-Mac
          cp -R "$ART/VST3/MidiCat.vst3" "$ART/AU/MidiCat.component" "$ART/Standalone/MidiCat.app" dist/MidiCat-Mac/
          cp packaging/LEEME-Mac.txt dist/MidiCat-Mac/LEEME.txt
          cd dist && ditto -c -k --sequesterRsrc --keepParent MidiCat-Mac MidiCat-Mac.zip

      - name: Crear el instalador (.pkg)
        run: |
          ART=build/MidiCat_artefacts/Release
          ROOT=pkgroot
          mkdir -p "$ROOT/Library/Audio/Plug-Ins/VST3" "$ROOT/Library/Audio/Plug-Ins/Components" "$ROOT/Applications"
          cp -R "$ART/VST3/MidiCat.vst3" "$ROOT/Library/Audio/Plug-Ins/VST3/"
          cp -R "$ART/AU/MidiCat.component" "$ROOT/Library/Audio/Plug-Ins/Components/"
          cp -R "$ART/Standalone/MidiCat.app" "$ROOT/Applications/"
          chmod +x packaging/mac/scripts/preinstall
          pkgbuild --analyze --root "$ROOT" comp.plist
          plutil -convert xml1 comp.plist
          sed -i '' -e '/<key>BundleIsRelocatable<\/key>/{n;s/<true\/>/<false\/>/;}' comp.plist
          grep -A1 BundleIsRelocatable comp.plist || true
          pkgbuild --root "$ROOT" --component-plist comp.plist --scripts packaging/mac/scripts \
            --identifier com.joeyocn.midicat --version 1.4.0 --install-location / dist/MidiCat-Instalador-Mac.pkg
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: MidiCat-Mac
          path: |
            dist/MidiCat-Mac.zip
            dist/MidiCat-Instalador-Mac.pkg

  windows:
    name: Windows (VST3 y app)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Configurar
        run: cmake -B build -A x64

      - name: Compilar
        run: cmake --build build --config Release --parallel 4

      - name: Probar con pluginval
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Depth 1 build\MidiCat_artefacts\Release
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          $p = Start-Process -FilePath .\pluginval\pluginval.exe -ArgumentList '--strictness-level','5','--skip-gui-tests','--validate-in-process','--timeout-ms','300000','--validate','"build\MidiCat_artefacts\Release\VST3\MidiCat.vst3"' -NoNewWindow -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }

      - name: Empaquetar
        shell: pwsh
        run: |
          $art = "build\MidiCat_artefacts\Release"
          New-Item -ItemType Directory -Force -Path dist\MidiCat-Windows | Out-Null
          Copy-Item -Recurse "$art\VST3\MidiCat.vst3" dist\MidiCat-Windows\
          Copy-Item "$art\Standalone\MidiCat.exe" dist\MidiCat-Windows\
          Copy-Item packaging\LEEME-Windows.txt dist\MidiCat-Windows\LEEME.txt
          Compress-Archive -Path dist\MidiCat-Windows -DestinationPath dist\MidiCat-Windows.zip

      - name: Crear el instalador
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\windows\MidiCat.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: MidiCat-Windows
          path: |
            dist/MidiCat-Windows.zip
            dist/MidiCat-Instalador-Windows.exe

  publicar:
    name: Publicar descargas
    needs: [mac, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Crear la versión descargable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima-version --yes --cleanup-tag -R "${{ github.repository }}" || true
          gh release create ultima-version dist/MidiCat-Instalador-Windows.exe dist/MidiCat-Instalador-Mac.pkg dist/MidiCat-Mac.zip dist/MidiCat-Windows.zip \
            -R "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "MidiCat · última versión" \
            --notes "Lo más fácil: descarga el instalador. Windows: MidiCat-Instalador-Windows.exe. Mac: MidiCat-Instalador-Mac.pkg. Ábrelo, dale Siguiente y listo; al abrir Ableton, Midi Cat ya aparece en tus plugins (y quita solo la versión vieja que se llamaba MidiSky). Los .zip son la versión para copiar a mano."
